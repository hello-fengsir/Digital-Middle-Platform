services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-producthub}
      POSTGRES_USER: ${POSTGRES_USER:-producthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-https://example.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-example-model}
    depends_on: {db: {condition: service_healthy}}
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
  tiancang:
    build: ./tiancang
    environment:
      TIANCANG_PDF_ROOT: /data/pdfs
      TIANCANG_ADMIN_USERNAME: ${TIANCANG_ADMIN_USERNAME:-admin}
      TIANCANG_ADMIN_PASSWORD: ${TIANCANG_ADMIN_PASSWORD:?set TIANCANG_ADMIN_PASSWORD}
      TIANCANG_SESSION_SECRET: ${TIANCANG_SESSION_SECRET:?set TIANCANG_SESSION_SECRET}
      TIANCANG_MAX_UPLOAD_BYTES: ${TIANCANG_MAX_UPLOAD_BYTES:-209715200}
    ports: ["${TIANCANG_PORT:-8087}:8000"]
    volumes: [tiancang-pdfs:/data/pdfs]
volumes: {db-data: {}, tiancang-pdfs: {}}
