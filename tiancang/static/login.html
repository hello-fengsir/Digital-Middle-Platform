<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天仓登录</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071326;color:#12213a;font-family:system-ui,"Microsoft YaHei"}form{width:min(92vw,390px);padding:28px;background:white;border-top:5px solid #e60013;border-radius:15px}h1{margin-top:0}input,button{width:100%;min-height:46px;margin:7px 0;padding:10px 12px;border:1px solid #bdccec;border-radius:9px;font-size:16px}button{background:#2078d4;color:white;font-weight:800}.m{color:#b91c1c;min-height:24px}</style></head><body><form onsubmit="go(event)"><h1>天仓 TianCang</h1><p>管理员认证</p><input name=username autocomplete=username placeholder=用户名 required><input name=password type=password autocomplete=current-password placeholder=密码 required><button>登录</button><div class=m></div></form><script>async function go(e){e.preventDefault();let r=await fetch('/api/login',{method:'POST',body:new FormData(e.target)});if(r.ok)location='/';else document.querySelector('.m').textContent=(await r.json()).detail||'登录失败'}</script></body></html>
