<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天仓 TianCang</title><style>:root{--n:#071326;--b:#2078d4;--r:#e60013;--line:#dce3ed}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#12213a;font:14px/1.5 system-ui,"Microsoft YaHei"}header{padding:18px max(20px,calc((100vw - 1280px)/2));color:white;background:linear-gradient(135deg,#030815,#0b1f3a);border-bottom:4px solid var(--r)}h1{margin:0;font-size:26px}.sub{color:#b9c7db}.wrap{max-width:1280px;margin:auto;padding:24px}.panel,.row{background:white;border:1px solid var(--line);border-radius:14px}.panel{padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}input,button{min-height:44px;padding:9px 12px;border:1px solid #bdccec;border-radius:9px;font-size:15px}button{cursor:pointer;background:var(--b);color:#fff;font-weight:700}.danger{background:#b91c1c}.ghost{background:#fff;color:#15365f}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px}.name{font-weight:800;overflow-wrap:anywhere}.path{color:#64748b;overflow-wrap:anywhere}.actions{display:flex;gap:8px;align-items:center}.actions a{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border:1px solid #9fb7dd;border-radius:8px;color:#0c3884;text-decoration:none;font-weight:700}.msg{min-height:22px;color:#a30e16}@media(max-width:768px){header{padding:12px 14px}h1{font-size:19px}.wrap{padding:14px}.grid{grid-template-columns:1fr}.grid button{width:100%}.toolbar{align-items:stretch;flex-direction:column}.row{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions a,.actions button{justify-content:center;width:100%}}</style></head><body><header><h1>天仓 TianCang · 企业产品材料管理仓库</h1><div class="sub">独立恢复版 · PDF.js 在线预览 · 移动/PC 响应式</div></header><main class="wrap"><section class="panel"><div class="grid"><input id="dir" placeholder="目录，如：测试/子目录"><input id="file" type="file" accept="application/pdf"><button onclick="upload()">上传 PDF</button><button class="ghost" onclick="mkdir()">新建目录</button><button class="ghost" onclick="refresh()">刷新目录</button><button class="danger" onclick="logout()">退出</button></div><div class="msg" id="msg"></div></section><section class="panel"><div class="toolbar"><strong id="count">PDF：加载中</strong><input id="search" placeholder="搜索文件名或路径" oninput="render()"></div><div class="rows" id="rows"></div></section></main><script>let all=[];const msg=x=>document.querySelector('#msg').textContent=x;async function api(u,o={}){let r=await fetch(u,o);if(r.status===401){location='/login';throw Error('未登录')}let j=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(j.detail||'请求失败');return j}async function refresh(){try{let j=await api('/api/files');all=j.files;document.querySelector('#count').textContent=`PDF：${j.count} 份`;render();msg('目录已刷新')}catch(e){msg(e.message)}}function render(){let q=document.querySelector('#search').value.toLowerCase(),box=document.querySelector('#rows');box.innerHTML='';all.filter(x=>x.path.toLowerCase().includes(q)).forEach(x=>{let d=document.createElement('div');d.className='row';d.innerHTML=`<div><div class=name></div><div class=path></div></div><div class=actions><a target=_blank>在线预览</a><a target=_blank>公开 PDF</a><button class=danger>删除</button></div>`;d.querySelector('.name').textContent=x.name;d.querySelector('.path').textContent=x.path;let a=d.querySelectorAll('a');a[0].href=x.viewer_url;a[1].href=x.public_url;d.querySelector('button').onclick=()=>del(x.path);box.append(d)})}async function mkdir(){try{let f=new FormData;f.set('path',document.querySelector('#dir').value);await api('/api/dirs',{method:'POST',body:f});msg('目录创建成功');await refresh()}catch(e){msg(e.message)}}async function upload(){try{let f=new FormData,fi=document.querySelector('#file').files[0];if(!fi)throw Error('请选择 PDF');f.set('directory',document.querySelector('#dir').value);f.set('file',fi);await api('/api/upload',{method:'POST',body:f});msg('上传成功');await refresh()}catch(e){msg(e.message)}}async function del(p){if(!confirm('仅删除此 PDF？'))return;try{await api('/api/files/'+p.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'});msg('删除成功');await refresh()}catch(e){msg(e.message)}}async function logout(){await api('/api/logout',{method:'POST'});location='/login'}refresh()</script></body></html>
